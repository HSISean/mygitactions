name: Super-Linter

on: push

jobs:
  super-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        id: lint
        uses: github/super-linter/slim@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          SAVE_SUPER_LINTER_OUTPUT: true   # enables error logs to be saved
          OUTPUT_DETAILS: detailed   # <-- REQUIRED to save logs

      - name: Print only linter errors
        if: failure()     # run only if Super-Linter fails
        run: |
          echo "================ LINTER ERRORS ================"
          if [ -d "super-linter-output/super-linter" ]; then
            # Print ONLY lines that contain actual linter error details
            grep -R "error:" -i super-linter-output/super-linter || echo "No detailed error messages found."
          else
            echo "No output directory found."
          fi
          echo "==============================================="
