name: Super-Linter


on: push

permissions:
  contents: read
  statuses: write  
jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  
      - name: Run Super-Linter
        uses: github/super-linter@v6
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          CREATE_LOG_FILE: true       # <--- Turn this on
          LOG_FILE: linter.log        # <--- Name the file

      # Add this step to upload the log file so you can download it
      - name: Upload Linter Artifact
        if: always()                  # Run this even if linting fails
        uses: actions/upload-artifact@v4
        with:
          name: linter-log
          path: linter.log
