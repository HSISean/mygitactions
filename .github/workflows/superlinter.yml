name: Code Checker

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main




permissions:
  contents: read
  statuses: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          CREATE_LOG_FILE: true       # <--- Turn this on
          LOG_FILE: linter.log        # <--- Name the file

      - name: Generate statistics
        id: stats
        run: |
          echo "passed_tests=42" >> "$GITHUB_OUTPUT"
          echo "failed_tests=1" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            echo "## Test Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- Passed: ${{ steps.stats.outputs.passed_tests }}" 
            echo "- Failed: ${{ steps.stats.outputs.failed_tests }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Add this step to upload the log file so you can download it
      - name: Upload Linter Artifact
        if: always()                  # Run this even if linting fails
        uses: actions/upload-artifact@v4
        with:
          name: linter-log
          path: linter.log
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run unit test
        run: |
          pytest --junitxml=results.xml
      - name: Add test summary
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "All test have been executed" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v1
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=myapp
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
      - name: Write graphical summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 📊 Test Summary (Graphical)

          ## Pie Chart
          ```mermaid
          pie showData
            "Passed" : ${{ steps.stats.outputs.passed_tests }}
            "Failed" : ${{ steps.stats.outputs.failed_tests }}
          ```

          ## Table Summary
          | Result | Count |
          |--------|-------|
          | Passed | ${{ steps.stats.outputs.passed_tests }} |
          | Failed | ${{ steps.stats.outputs.failed_tests }} |
          EOF
  security-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Trivy Scan
        run: |
          sudo apt-get install wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install trivy -y

      - name: Trivy FS Scan
        run: trivy fs . --format json -o fs-report.json

      - name: Gitleaks Scan
        run: sudo apt install gitleaks -y

      - name: Gitleaks Code Scan
        run: gitleaks detect -s . -r gitleaks-report.json -f json
